name: ci
# actions.lock pins every action below to a commit, not a SHA here. After
# changing a uses: line, run `gh actions-lock` (github/gh-actions-lock) and
# commit the lockfile, as the source repository these plugins come from
# does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# One run per ref at a time: a newer push supersedes an older run's verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plugins:
    # Claude Code's own reading of the plugin format, pinned by
    # .github/plugin-validate/package-lock.json at the version the source
    # repository's CI validates with, so an export that passed there passes
    # here; it needs no sign-in. On the root it reads only marketplace.json,
    # so each plugin gets its own run. No --strict: it fails every warning,
    # among them a plugin with no version, which these omit on purpose so
    # installs track commits, and the empty marketplace's own.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install the pinned Claude Code
        run: npm ci --prefix .github/plugin-validate --no-audit --no-fund
      - name: Validate the marketplace and each plugin
        shell: bash
        run: |
          # nullglob: with no plugins/ yet the loop runs zero times, rather
          # than once on the literal pattern, which validate would fail.
          shopt -s nullglob
          claude=.github/plugin-validate/node_modules/.bin/claude
          "$claude" --version
          "$claude" plugin validate .
          plugins=(plugins/*/)
          echo "${#plugins[@]} plugin(s) under plugins/"
          for plugin in "${plugins[@]}"; do
            "$claude" plugin validate "$plugin"
          done
  pre-commit:
    # From audit-repo's pre-commit workflow scaffold. gitleaks runs as its
    # own step over every commit, not as the hook: the hook scans the index
    # (`gitleaks git --pre-commit --staged`), empty in CI, so it would pass
    # having scanned nothing. The binary is the release the baseline's hook
    # pins, checked against its release's checksums file; raise both
    # together. identity-guard reads the maintainer's scanner, absent on a
    # runner, so it skips with exit 0: a green run says nothing about it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets (gitleaks)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: Run every other hook on every file
        env:
          SKIP: gitleaks
        run: pipx run --spec 'pre-commit==4.7.0' pre-commit run --all-files --show-diff-on-failure
